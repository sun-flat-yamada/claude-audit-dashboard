version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
      - 'javascript'
    groups:
      react:
        patterns:
          - 'react*'
          - '@types/react*'
      vite:
        patterns:
          - 'vite*'
          - '@vitejs/*'
          - 'vitest*'
          - '@vitest/*'
      tailwind:
        patterns:
          - 'tailwindcss*'
          - '@tailwindcss/*'
          - 'prettier-plugin-tailwindcss'
      lint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'globals'
          - 'prettier'
      types:
        patterns:
          - '@types/*'
        exclude-patterns:
          - '@types/react*'

  - package-ecosystem: 'github-actions'
    # Workflows plus the local composite action used by every workflow.
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(deps)'
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      actions:
        patterns:
          - '*'
