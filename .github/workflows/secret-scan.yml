name: 🛡️ Automated Secret & PII Scanning

on:
  push:
    branches-ignore: [data/audit]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-secrets:
    name: Gitleaks & Repository Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Built-in Secret & Privacy Audit Scanner
        run: pnpm secret-scan

      - name: Run Gitleaks Security Scan (Industry Standard)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
