name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types & fork safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm fork:verify
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm audit:deps

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build

  e2e:
    name: E2E and accessibility
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v7
      # Builds core and the collector (the profiles need them); the dashboard build itself is made once
      # by `test:e2e` with the Pages base path and then reused by every data profile.
      - uses: ./.github/actions/setup
        with:
          build: build:collector
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @claude-audit/dashboard exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and its system libraries
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @claude-audit/dashboard exec playwright install --with-deps chromium
      - name: Install the system libraries only (browser restored from the cache)
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @claude-audit/dashboard exec playwright install-deps chromium
      - name: Generate the synthetic data profiles
        run: pnpm fixture && pnpm demo --profile optional-sources
      - name: Run the E2E and axe suite
        run: pnpm --filter @claude-audit/dashboard test:e2e
      # Traces, screenshots and the axe results (attached to each test) are only kept for a failed run.
      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-results
          path: |
            packages/dashboard/.e2e/report
            packages/dashboard/.e2e/test-results
          retention-days: 14
