name: Monthly Usage & Cost Report

on:
  schedule:
    # 1st of each month at 03:00 UTC (covers the previous calendar month)
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Target month (YYYY-MM). Defaults to the previous month.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: audit-data
  cancel-in-progress: false

jobs:
  report:
    name: Generate & send report
    runs-on: ubuntu-latest
    # Scheduled runs are opt-in: set repository variable ENABLE_SCHEDULED_JOBS=true.
    if: github.event_name != 'schedule' || vars.ENABLE_SCHEDULED_JOBS == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: ./.github/actions/setup
        with:
          build: build:collector

      - name: Restore stored data
        run: .github/scripts/data-branch.sh restore

      # The monthly report re-reads usage and cost for the whole month from the Analytics API.
      - name: Generate and send the monthly report
        run: |
          if [ -n "$TARGET_MONTH" ]; then
            pnpm report:monthly --month "$TARGET_MONTH" --notify
          else
            pnpm report:monthly --notify
          fi
        env:
          TARGET_MONTH: ${{ inputs.month }}
          ANTHROPIC_ENTERPRISE_API_KEY: ${{ secrets.ANTHROPIC_ENTERPRISE_API_KEY }}
          ANTHROPIC_COMPLIANCE_API_KEY: ${{ secrets.ANTHROPIC_COMPLIANCE_API_KEY }}
          ANTHROPIC_ANALYTICS_API_KEY: ${{ secrets.ANTHROPIC_ANALYTICS_API_KEY }}
          ANTHROPIC_ADMIN_API_KEY: ${{ secrets.ANTHROPIC_ADMIN_API_KEY }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}

      - name: Save the report to the data/audit branch
        run: |
          .github/scripts/data-branch.sh save "chore: monthly report $(date -u +%Y-%m-%d) [skip ci]"
