name: Release

# Pushing a `vX.Y.Z` tag runs the full verification and, only if everything passes, publishes the GitHub Release
# with the matching CHANGELOG.md section as its notes (issue #41). The owner pushes the tag; nothing here creates one.
# Procedure and prerequisites: docs/DEPLOYMENT.md (Releasing).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# One run per tag; a started release is never cancelled half way.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate the tag name
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag is not vX.Y.Z (no pre-release or build suffix); no Release is created."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: ./.github/actions/setup
      - name: Install Chromium and its system libraries
        run: pnpm --filter @claude-audit/dashboard exec playwright install --with-deps chromium
      # fork:verify, typecheck, test, secret-scan, build, lint, format:check, audit:deps, test:e2e (incl. axe)
      - name: Run the full verification
        run: pnpm verify:all
      - name: Check the tag against the package versions and extract the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: pnpm release:check --tag "$TAG" --notes "$RUNNER_TEMP/release-notes.md"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish the GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag is not vX.Y.Z; no Release is created."
            exit 1
          fi
          flags=()
          if [[ "$TAG" == v0.* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes/release-notes.md" "${flags[@]}"
