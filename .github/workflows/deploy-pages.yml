name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - 'packages/dashboard/**'
      - 'data/sample/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_run:
    workflows: ['Collect Audit Data']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Dashboard
    runs-on: ubuntu-latest
    # Published data is the synthetic sample unless the repository variable
    # PAGES_DATA_SOURCE=live is set (only for Pages sites restricted to your organization).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && vars.PAGES_DATA_SOURCE == 'live')
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: ./.github/actions/setup

      - name: Stage dashboard data
        env:
          PAGES_DATA_SOURCE: ${{ vars.PAGES_DATA_SOURCE }}
        run: |
          mkdir -p packages/dashboard/public/data
          if [ "$PAGES_DATA_SOURCE" = "live" ]; then
            git fetch --quiet --depth=1 origin data/audit
            git show FETCH_HEAD:data/dashboard.json > packages/dashboard/public/data/dashboard.json
            echo "Staged live data from data/audit"
          else
            cp data/sample/dashboard.json packages/dashboard/public/data/dashboard.json
            echo "Staged the synthetic sample (set PAGES_DATA_SOURCE=live to publish live data)"
          fi

      - name: Build dashboard
        run: pnpm build:dashboard
        env:
          STAGED_DATA: '1'

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./packages/dashboard/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
