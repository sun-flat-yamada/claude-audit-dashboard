name: Setup workspace
description: Install pnpm (the packageManager pin in package.json), Node.js (.nvmrc) and the workspace dependencies, then optionally run one build script.

inputs:
  build:
    description: Optional root package script to run after install (for example build:collector).
    required: false
    default: ''

runs:
  using: composite
  steps:
    # No `version:` input: pnpm/action-setup installs the exact packageManager pin.
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Build
      if: inputs.build != ''
      shell: bash
      env:
        BUILD_SCRIPT: ${{ inputs.build }}
      run: pnpm run "$BUILD_SCRIPT"
